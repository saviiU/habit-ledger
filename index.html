<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Ledger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ledger">
    <header class="ledger-header">
      <div>
        <p class="eyebrow">Field Journal</p>
        <h1>Habit Ledger</h1>
      </div>

      <div class="month-nav">
        <button id="prev-month" aria-label="Previous month">&lt;</button>
        <span id="month-label"></span>
        <button id="next-month" aria-label="Next month">&gt;</button>
      </div>
    </header>

    <section class="section">
      <h2 class="section-title">Habits</h2>
      <div class="grid-wrap">
        <table id="habit-table"></table>
      </div>
      <button id="add-habit" class="add-btn">+ Add habit</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
